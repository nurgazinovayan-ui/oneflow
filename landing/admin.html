<title>ONEFLOW Admin</title>
<style>
:root { --bg: #f5f5f7; --surface: #fff; --ink: #111114; --ink2: #3c3c46; --muted: #80808c; --line: #e6e6ec; --soft: #f0f0f4; --acc: #3b5cff; --acc-soft: #eef1ff;
  --good: #16a36a; --warn: #c27c0e; --bad: #d64545; --r: 14px; --f: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; --m: ui-monospace, 'JetBrains Mono', Menlo, monospace; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0c0c10; --surface: #15151b; --ink: #f2f2f5; --ink2: #c6c6d0; --muted: #8b8b98; --line: #26262f; --soft: #1d1d25; --acc: #6f8bff; --acc-soft: #1b2140; } }
:root[data-theme="dark"] { --bg: #0c0c10; --surface: #15151b; --ink: #f2f2f5; --ink2: #c6c6d0; --muted: #8b8b98; --line: #26262f; --soft: #1d1d25; --acc: #6f8bff; --acc-soft: #1b2140; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--ink); font: 400 14px/1.45 var(--f); -webkit-font-smoothing: antialiased; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--acc); text-decoration: none; } a:hover { text-decoration: underline; }
.hide { display: none !important; }
.mk { width: 26px; height: 18px; flex: none; }
/* login */
.login { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
.login form { width: 100%; max-width: 360px; display: grid; gap: 12px; padding: 28px; border-radius: 20px; background: var(--surface); box-shadow: 0 0 0 1px var(--line), 0 30px 60px -40px rgba(0,0,0,.35); }
.login h1 { display: flex; align-items: center; gap: 10px; font-size: 20px; margin-bottom: 6px; }
.field { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
.in { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); outline: none; }
.in:focus { border-color: var(--acc); box-shadow: 0 0 0 3px var(--acc-soft); }
textarea.in { min-height: 90px; resize: vertical; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 14px; border: 0; border-radius: 10px; background: var(--ink); color: var(--bg); font-weight: 600; white-space: nowrap; }
.btn.s { background: var(--soft); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); font-weight: 500; }
.btn.a { background: var(--acc); color: #fff; }
.btn:disabled { opacity: .5; cursor: default; }
.err { color: var(--bad); font-size: 13px; min-height: 18px; }
.or { text-align: center; color: var(--muted); font-size: 12px; }
/* shell */
.app { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 4px; padding: 18px 12px; border-right: 1px solid var(--line); background: var(--surface); }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px; font-weight: 700; letter-spacing: -.01em; } .brand small { font-weight: 500; color: var(--muted); }
.nav { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; border: 0; border-radius: 9px; background: none; text-align: left; color: var(--ink2); font-weight: 500; }
.nav:hover { background: var(--soft); } .nav.on { background: var(--acc-soft); color: var(--acc); }
.nav .cnt { margin-left: auto; min-width: 20px; padding: 0 6px; border-radius: 99px; background: var(--bad); color: #fff; font-size: 11px; font-weight: 700; text-align: center; }
.side .foot { margin-top: auto; display: grid; gap: 6px; padding: 10px; font-size: 12px; color: var(--muted); }
.main { min-width: 0; padding: 22px 28px 60px; }
.top { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; } .top h2 { font-size: 22px; letter-spacing: -.02em; margin-right: auto; }
.upd { font-size: 12px; color: var(--muted); }
.demo { padding: 3px 8px; border-radius: 6px; background: #fff4d6; color: #7a5200; font-size: 12px; font-weight: 600; white-space: nowrap; }
/* cards / tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
.tile { padding: 16px; border-radius: var(--r); background: var(--surface); box-shadow: 0 0 0 1px var(--line); }
.tile span { font-size: 12.5px; color: var(--muted); } .tile b { display: block; margin-top: 6px; font-size: 28px; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.tile small { color: var(--muted); font-size: 12px; }
.card { padding: 18px; border-radius: var(--r); background: var(--surface); box-shadow: 0 0 0 1px var(--line); margin-bottom: 16px; }
.card h3 { font-size: 14px; margin-bottom: 12px; } .card h3 small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; }
/* chart */
.chart { position: relative; height: 220px; }
.chart svg { display: block; width: 100%; height: 100%; overflow: visible; }
.chart .gl { stroke: var(--line); stroke-width: 1; } .chart .ax { fill: var(--muted); font-size: 11px; font-family: var(--f); }
.chart .bar { fill: var(--acc); } .chart .hit { fill: transparent; } .chart .hit:hover + .bar, .chart g.on .bar { fill: var(--ink); }
.tip { position: absolute; pointer-events: none; padding: 7px 10px; border-radius: 8px; background: var(--ink); color: var(--bg); font-size: 12px; white-space: nowrap; transform: translate(-50%, -110%); }
/* tables */
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; } .tools .in { max-width: 280px; }
.seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 10px; background: var(--soft); }
.seg button { padding: 6px 11px; border: 0; border-radius: 8px; background: none; color: var(--ink2); font-size: 13px; font-weight: 500; } .seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.tw { overflow-x: auto; border-radius: var(--r); background: var(--surface); box-shadow: 0 0 0 1px var(--line); }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th { position: sticky; top: 0; padding: 10px 12px; background: var(--surface); border-bottom: 1px solid var(--line); color: var(--muted); font-weight: 500; font-size: 12.5px; text-align: left; white-space: nowrap; }
th.s { cursor: pointer; user-select: none; } th.s:hover { color: var(--ink); } th .ar { margin-left: 4px; }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; } tr:last-child td { border-bottom: 0; }
tbody tr.cl { cursor: pointer; } tbody tr.cl:hover td { background: var(--soft); }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.mono { font-family: var(--m); font-size: 12.5px; }
.dim { color: var(--muted); }
.dot { display: inline-flex; align-items: center; gap: 6px; } .dot::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.dot.good::before { background: var(--good); } .dot.warn::before { background: var(--warn); } .dot.bad::before { background: var(--bad); }
.share { display: inline-block; width: 90px; height: 6px; margin-left: 8px; border-radius: 3px; background: var(--soft); vertical-align: middle; overflow: hidden; } .share i { display: block; height: 100%; border-radius: 3px; background: var(--acc); }
.empty { padding: 28px; text-align: center; color: var(--muted); }
/* drawer */
.drawer { position: fixed; inset: 0 0 0 auto; z-index: 20; width: min(520px, 100vw); overflow-y: auto; padding: 22px; background: var(--surface); box-shadow: -30px 0 60px -30px rgba(0,0,0,.35); }
.shade { position: fixed; inset: 0; z-index: 19; background: rgba(0,0,0,.25); }
.drawer h3 { font-size: 18px; margin: 0 40px 4px 0; word-break: break-all; } .drawer .x { position: absolute; right: 16px; top: 16px; }
.kv { display: grid; grid-template-columns: 140px 1fr; gap: 8px 12px; margin: 16px 0; font-size: 13.5px; } .kv dt { color: var(--muted); }
.msg { white-space: pre-wrap; padding: 14px; border-radius: 12px; background: var(--soft); margin: 12px 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.ok { color: var(--good); font-size: 13px; }
/* content editor */
.grp { margin-bottom: 18px; } .grp > h4 { margin: 0 0 8px; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.ci { display: grid; grid-template-columns: 150px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 12px; border-bottom: 1px solid var(--line); }
.ci:last-child { border-bottom: 0; } .ci .k { font-family: var(--m); font-size: 11.5px; color: var(--muted); word-break: break-all; padding-top: 10px; }
.ci textarea { min-height: 40px; } .ci .acts { display: grid; gap: 6px; } .ci.changed { background: var(--acc-soft); }
.tag { display: inline-block; margin-left: 6px; padding: 1px 6px; border-radius: 5px; background: var(--acc); color: #fff; font: 600 10.5px var(--f); vertical-align: 1px; }
.tag.old { background: var(--warn); }
/* app banners editor */
.bn { display: grid; grid-template-columns: minmax(260px, 380px) minmax(0, 1fr); gap: 18px; }
.bn-prev { position: relative; aspect-ratio: 16 / 7; border-radius: 12px; overflow: hidden; background: #0b0b0d; }
.bn-prev img, .bn-prev video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.bn-prev .ov { position: absolute; inset: 0 40% 0 0; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; color: #fff; background: linear-gradient(90deg, rgba(5,8,12,.82), rgba(5,8,12,.6) 62%, rgba(5,8,12,0)); }
.bn-prev .ov small { align-self: flex-start; padding: 1px 6px; border-radius: 5px; background: rgba(155,232,255,.18); color: #9be8ff; font-size: 10px; font-weight: 700; }
.bn-prev .ov b { font-size: 14px; line-height: 1.2; } .bn-prev .ov span { font-size: 11px; opacity: .8; line-height: 1.35; } .bn-prev .ov i { margin-top: auto; font-style: normal; font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: #9be8ff; }
.bn-prev .none { position: absolute; inset: 0; display: grid; place-items: center; color: #8b8b98; font-size: 13px; }
.bn-num { position: absolute; right: 8px; top: 8px; padding: 2px 8px; border-radius: 6px; background: rgba(0,0,0,.65); color: #fff; font-size: 11px; font-weight: 700; }
.bn-langs { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.bn-langs h5 { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
.bn-langs .field { margin-bottom: 8px; } .bn-langs textarea.in { min-height: 60px; }
.bn-link { display: grid; grid-template-columns: minmax(0, 220px) minmax(0, 1fr); gap: 8px; }
.upl { position: relative; overflow: hidden; } .upl input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.note { padding: 12px 14px; border-radius: 12px; background: var(--acc-soft); color: var(--ink2); margin-bottom: 14px; font-size: 13px; }
@media (max-width: 1100px) { .bn { grid-template-columns: 1fr; } .bn-langs { grid-template-columns: 1fr; } }
@media (max-width: 900px) { .app { grid-template-columns: 1fr; }
  .side { z-index: 5; height: auto; flex-direction: row; align-items: center; gap: 2px; padding: 8px 12px; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); scrollbar-width: none; }
  .side::-webkit-scrollbar { display: none; } .side .brand { padding: 4px 8px 4px 0; } .brand small, .side .foot > :not(#out) { display: none; }
  .nav { width: auto; flex: none; white-space: nowrap; padding: 8px 10px; } .side .foot { margin: 0 0 0 auto; padding: 0 0 0 8px; }
  .main { padding: 16px; } .grid2 { grid-template-columns: 1fr; } .ci { grid-template-columns: 1fr; } }
</style>

<script>
(() => {
  const SB = 'https://ayxmfihtrsacfdhszsri.supabase.co';
  const KEY = 'sb_publishable_xfd5nkUu18qvdzoo-dzhHQ_f5RKq4tS';   // publishable by design (it ships in the app bundle too)
  const DEMO = new URLSearchParams(location.search).has('demo');
  const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const fmtN = (n) => Number(n || 0).toLocaleString('ru-RU');
  const fmt$ = (n) => '$' + Number(n || 0).toLocaleString('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const fmtD = (s, time = true) => s ? new Date(s).toLocaleString('ru-RU', time ? { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' } : { day: '2-digit', month: '2-digit', year: 'numeric' }) : '—';
  const ago = (s) => { if (!s) return '—'; const m = Math.round((Date.now() - Date.parse(s)) / 60000); if (m < 1) return 'только что'; if (m < 60) return m + ' мин назад'; const h = Math.round(m / 60); if (h < 24) return h + ' ч назад'; return Math.round(h / 24) + ' дн назад'; };

  // ---------------------------------------------------------------- session (Supabase Auth REST)
  const store = { get: () => { try { return JSON.parse(localStorage.getItem('of-admin') || 'null'); } catch { return null; } },
    set: (s) => { try { s ? localStorage.setItem('of-admin', JSON.stringify(s)) : localStorage.removeItem('of-admin'); } catch {} } };
  let session = store.get();
  const saveTokens = (d) => { session = { access: d.access_token, refresh: d.refresh_token, exp: Date.now() + (Number(d.expires_in) || 3600) * 1000, email: d.user?.email || session?.email || '' }; store.set(session); };
  const refresh = async () => {
    const r = await fetch(SB + '/auth/v1/token?grant_type=refresh_token', { method: 'POST', headers: { apikey: KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ refresh_token: session.refresh }) });
    if (!r.ok) throw new Error('Сессия истекла, войдите снова.');
    saveTokens(await r.json());
  };
  const token = async () => { if (!session) throw new Error('Не выполнен вход.'); if (Date.now() > session.exp - 60000) await refresh(); return session.access; };
  const call = async (fn, body) => {
    const r = await fetch(`${SB}/functions/v1/${fn}`, { method: 'POST', headers: { Authorization: 'Bearer ' + await token(), apikey: KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || ('Ошибка ' + r.status));
    return d;
  };
  // Google OAuth returns tokens in the URL hash (same flow as the app's WebAuthGate)
  if (location.hash.includes('access_token=')) {
    const h = new URLSearchParams(location.hash.slice(1));
    saveTokens({ access_token: h.get('access_token'), refresh_token: h.get('refresh_token'), expires_in: h.get('expires_in') });
    history.replaceState(null, '', location.pathname + location.search);
  }

  // ---------------------------------------------------------------- data
  let D = null, view = 'overview';
  const api = DEMO ? demoApi() : { overview: () => call('admin-api', { action: 'overview' }), ticket: (b) => call('admin-api', { action: 'ticket-update', ...b }),
    content: (b) => call('admin-api', { action: 'content-save', ...b }), send: (emails, message) => call('admin-send-message', { mode: 'selected', emails, message }),
    banners: (slides) => call('admin-api', { action: 'banners-save', slides }), mediaUrl: (b) => call('admin-api', { action: 'media-upload-url', ...b }),
    mediaDelete: (path) => call('admin-api', { action: 'media-delete', path }) };
  const load = async () => {
    $('#rf').disabled = true;
    try { D = await api.overview(); $('#upd').textContent = 'обновлено ' + new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }); render(); }
    catch (e) { if (/Доступ|Сессия|вход/.test(e.message)) return logout(e.message); $('#upd').textContent = e.message; }
    finally { $('#rf').disabled = false; }
  };

  // ---------------------------------------------------------------- views
  const TITLES = { overview: 'Обзор', users: 'Пользователи', gens: 'Генерации', support: 'Поддержка', content: 'Тексты сайта', banners: 'Баннеры приложения' };
  const go = (v) => { view = v; $$('.nav').forEach((b) => b.classList.toggle('on', b.dataset.v === v)); Object.keys(TITLES).forEach((k) => $('#v-' + k).classList.toggle('hide', k !== v)); $('#title').textContent = TITLES[v]; render(); };
  $$('.nav').forEach((b) => b.addEventListener('click', () => go(b.dataset.v)));
  const render = () => { if (!D) return; const n = D.tickets.filter((t) => t.status === 'new').length; $('#tcnt').textContent = n; $('#tcnt').classList.toggle('hide', !n);
    ({ overview: vOverview, users: vUsers, gens: vGens, support: vSupport, content: vContent, banners: vBanners })[view](); };

  const days = () => { const out = [], m = new Map(D.stats.byDay.map((d) => [d.day, d])); for (let i = D.stats.days - 1; i >= 0; i--) { const d = new Date(Date.now() - i * 86400000).toISOString().slice(0, 10); out.push(m.get(d) || { day: d, count: 0, spend: 0 }); } return out; };

  function barChart(el, data) {  // single series → no legend; hover tooltip per bar; 4px rounded tops on the baseline
    const W = Math.max(el.clientWidth, 300), H = 220, L = 36, B = 22, T = 8, max = Math.max(4, ...data.map((d) => d.count)), step = Math.pow(10, Math.floor(Math.log10(max))) * (max / Math.pow(10, Math.floor(Math.log10(max))) > 5 ? 2 : 1);
    const top = Math.ceil(max / step) * step, y = (v) => T + (H - T - B) * (1 - v / top), bw = (W - L) / data.length, gap = 2;
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Генерации по дням">`;

    data.forEach((d, i) => { const x = L + i * bw + gap / 2, w = Math.max(2, bw - gap), h = (H - T - B) - (y(d.count) - T), r = Math.min(4, w / 2, h);

      ru: { tag: 'Creative Predictor', title: 'Узнайте, какой креатив сильнее — до запуска', text: 'Загрузите до 3 вариантов и получите оценку и советы, что улучшить.', button: 'Подробнее' },
      en: { tag: 'Creative Predictor', title: 'Find the stronger creative before launch', text: 'Upload up to 3 variants and get a score and tips on what to improve.', button: 'Learn more' } }];
  const emptyLang = () => ({ tag: '', title: '', text: '', button: '' });
  const pathOf = (url) => (typeof url === 'string' && url.startsWith(MEDIA_PREFIX) ? url.slice(MEDIA_PREFIX.length) : null);
  const slidePaths = (list) => list.flatMap((x) => [pathOf(x.media), pathOf(x.poster)]).filter(Boolean);
  let bn = null;  // { slides, saved: paths referenced by the published version, uploaded: paths uploaded in this session, dirty, busy, msg }
  const bnLoad = () => {
    const row = D.content.find((c) => c.key === BANNERS_KEY);
    let slides = [];
    try { slides = row ? (JSON.parse(row.value).slides || []) : []; } catch { slides = []; }
    slides = slides.map((x) => ({ id: x.id || crypto.randomUUID(), type: x.type === 'video' ? 'video' : 'image', media: x.media || '', poster: x.poster || '', link: x.link || '',
      ru: { ...emptyLang(), ...(x.ru || {}) }, en: { ...emptyLang(), ...(x.en || {}) } }));

  };
  const bnUpload = async (file) => {
    const max = TYPES[file.type];
    if (!max) throw new Error('Поддерживаются JPG, PNG, WebP, GIF, MP4 и WebM.');
    if (file.size > max * 1024 * 1024) throw new Error(`Файл слишком большой: максимум ${max} МБ.`);
    const u = await api.mediaUrl({ name: file.name, type: file.type, size: file.size });
    if (DEMO) return URL.createObjectURL(file);
    const fd = new FormData(); fd.append('cacheControl', '31536000'); fd.append('', file);
    const r = await fetch(u.signedUrl, { method: 'PUT', headers: { apikey: KEY, Authorization: 'Bearer ' + await token(), 'x-upsert': 'false' }, body: fd });
    if (!r.ok) throw new Error('Не удалось загрузить файл (' + r.status + ').');
    bn.uploaded.push(u.path);
    return u.publicUrl;
  };
  function vBanners() {
    if (!bn) bnLoad();
    const el = $('#v-banners');
    const linkSel = (x) => { const v = x.link || '', isUrl = v && !v.startsWith('mode:');
      return `<div class="bn-link"><select class="in" data-k="linkType" aria-label="Куда ведёт кнопка"><option value="">Без кнопки</option>${MODES.map(([m, l]) => `<option value="mode:${m}" ${v === 'mode:' + m ? 'selected' : ''}>Режим: ${esc(l)}</option>`).join('')}<option value="url" ${isUrl ? 'selected' : ''}>Внешняя ссылка…</option></select>

    const prev = (x, i) => { const m = x.media ? (x.type === 'video' ? `<video src="${esc(x.media)}" ${x.poster ? `poster="${esc(x.poster)}"` : ''} muted loop playsinline autoplay></video>` : `<img src="${esc(x.media)}" alt="">`) : '<div class="none">Нет файла</div>';
      const t = x.ru.title || x.en.title, tag = x.ru.tag || x.en.tag, tx = x.ru.text || x.en.text, b = x.link ? (x.ru.button || x.en.button || 'Подробнее') : '';
      return `<div class="bn-prev">${m}<div class="ov">${tag ? `<small>${esc(tag)}</small>` : ''}<b>${esc(t || 'Заголовок')}</b><span>${esc(tx)}</span>${b ? `<i>▸ ${esc(b)}</i>` : ''}</div><span class="bn-num">${i + 1}</span></div>`; };
    el.innerHTML = `<div class="tools"><button class="btn a" id="bsave" type="button" ${bn.dirty && !bn.busy ? '' : 'disabled'}>Сохранить и опубликовать</button>
        <button class="btn s" id="badd" type="button" ${bn.slides.length >= 12 ? 'disabled' : ''}>+ Добавить баннер</button>
        ${bn.slides.length ? '' : '<button class="btn s" id="bdef" type="button">Взять стандартные для правки</button>'}
        <span class="${/Ошибка|Не удалось|должн|Недопуст|слишком|Поддерживаются|Ссылка/.test(bn.msg) ? 'err' : 'ok'}" id="bmsg" role="status">${esc(bn.msg)}</span>
        <a class="btn s" href="/app" target="_blank" rel="noopener" style="margin-left:auto">Открыть приложение ↗</a></div>

        Фото до 10 МБ (JPG, PNG, WebP, GIF), видео до 50 МБ (MP4, WebM). Картинка растягивается на весь баннер, текст — слева на затемнении. Английский текст необязателен: если его нет, показывается русский.</div>
      ${bn.slides.map((x, i) => `<div class="card" data-i="${i}"><div class="bn"><div>${prev(x, i)}
          <div class="row"><label class="btn s upl">${x.media ? 'Заменить фото / видео' : 'Загрузить фото / видео'}<input type="file" data-f="media" accept="${Object.keys(TYPES).join(',')}"></label>
          ${x.type === 'video' ? `<label class="btn s upl">${x.poster ? 'Заменить обложку' : 'Обложка видео'}<input type="file" data-f="poster" accept="image/jpeg,image/png,image/webp"></label>${x.poster ? '<button class="btn s" data-a="unposter" type="button">Убрать обложку</button>' : ''}` : ''}</div>
          <div class="row"><button class="btn s" data-a="up" type="button" ${i ? '' : 'disabled'} aria-label="Выше">↑</button><button class="btn s" data-a="down" type="button" ${i < bn.slides.length - 1 ? '' : 'disabled'} aria-label="Ниже">↓</button><button class="btn s" data-a="del" type="button" style="color:var(--bad)">Удалить баннер</button></div></div>
        <div><div class="bn-langs">${langBlock(x, 'ru', 'Русский')}${langBlock(x, 'en', 'English')}</div>
          <div class="field">Кнопка ведёт${linkSel(x)}</div></div></div></div>`).join('') || '<p class="empty">Своих баннеров пока нет.</p>'}`;
    const touch = (msg = '') => { bn.dirty = true; bn.msg = msg; const b = $('#bsave'); if (b) b.disabled = bn.busy; const m = $('#bmsg'); if (m) { m.textContent = msg; m.className = 'ok'; } };
    $('#badd')?.addEventListener('click', () => { bn.slides.push({ id: crypto.randomUUID(), type: 'image', media: '', poster: '', link: '', ru: emptyLang(), en: emptyLang() }); touch(); vBanners(); });

    $$('#v-banners .card').forEach((card) => { const i = Number(card.dataset.i), x = bn.slides[i];
      $$('[data-l]', card).forEach((inp) => inp.addEventListener('input', () => { x[inp.dataset.l][inp.dataset.k] = inp.value; touch();
        const p = $('.bn-prev', card); if (p) p.outerHTML = prev(x, i); }));
      const sel = $('[data-k=linkType]', card), url = $('[data-k=url]', card);
      sel.addEventListener('change', () => { url.classList.toggle('hide', sel.value !== 'url'); x.link = sel.value === 'url' ? url.value.trim() : sel.value; touch(); $('.bn-prev', card).outerHTML = prev(x, i); if (sel.value === 'url') url.focus(); });
      url.addEventListener('input', () => { x.link = url.value.trim(); touch(); });
      $$('input[type=file]', card).forEach((f) => f.addEventListener('change', async () => {
        const file = f.files[0]; f.value = ''; if (!file) return;
        bn.busy = true; bn.msg = 'Загружаю ' + file.name + '…'; vBanners();

          if (f.dataset.f === 'media') { x.media = u; x.type = file.type.startsWith('video/') ? 'video' : 'image'; if (x.type === 'image') x.poster = ''; } else x.poster = u;
          bn.busy = false; touch('Файл загружен. Не забудьте сохранить.'); }
        catch (e) { bn.busy = false; bn.msg = e.message; }
        vBanners(); }));
      $$('[data-a]', card).forEach((b) => b.addEventListener('click', () => { const a = b.dataset.a;
        if (a === 'up' || a === 'down') { const j = a === 'up' ? i - 1 : i + 1; [bn.slides[i], bn.slides[j]] = [bn.slides[j], bn.slides[i]]; }

      if (badUrl >= 0) { bn.msg = `Баннер ${badUrl + 1}: Ссылка должна начинаться с https://`; return vBanners(); }
      bn.busy = true; bn.msg = 'Сохраняю…'; vBanners();

        const r = await api.banners(bn.slides);
        D.content = D.content.filter((c) => c.key !== BANNERS_KEY);
        if (!r.reset) D.content.push({ key: BANNERS_KEY, value: r.value || JSON.stringify({ v: 1, slides: bn.slides }), updated_at: new Date().toISOString() });

        const keep = new Set(slidePaths(bn.slides)), unused = [...new Set([...bn.saved, ...bn.uploaded])].filter((p) => !keep.has(p));

        bnLoad(); bn.msg = r.reset ? 'Сохранено: в приложении снова стандартные баннеры.' : 'Сохранено и опубликовано.';
      } catch (e) { bn.busy = false; bn.msg = e.message; }

  }

  // ---------------------------------------------------------------- drawer, auth wiring
  const openDrawer = (html) => { $('#drawer').innerHTML = '<button class="btn s x" type="button" aria-label="Закрыть">✕</button>' + html; $('#drawer').classList.remove('hide'); $('#shade').classList.remove('hide'); $('.drawer .x').addEventListener('click', closeDrawer); };
  const closeDrawer = () => { $('#drawer').classList.add('hide'); $('#shade').classList.add('hide'); };
  $('#shade').addEventListener('click', closeDrawer); addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDrawer(); });
  $('#rf').addEventListener('click', load);
  const logout = (msg) => { if (session?.access && !DEMO) fetch(SB + '/auth/v1/logout?scope=local', { method: 'POST', headers: { apikey: KEY, Authorization: 'Bearer ' + session.access } }).catch(() => {});  // revoke the refresh token server-side
    session = null; store.set(null); $('#app').classList.add('hide'); $('#login').classList.remove('hide'); $('#lerr').textContent = typeof msg === 'string' ? msg : ''; };
  $('#out').addEventListener('click', () => logout());
  const start = () => { $('#login').classList.add('hide'); $('#app').classList.remove('hide'); $('#who').textContent = DEMO ? 'demo@oneflow.art' : (session?.email || ''); $('#demo').classList.toggle('hide', !DEMO); load(); };
  $('#lf').addEventListener('submit', async (e) => { e.preventDefault(); $('#lb').disabled = true; $('#lerr').textContent = '';
    try { const r = await fetch(SB + '/auth/v1/token?grant_type=password', { method: 'POST', headers: { apikey: KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ email: $('#le').value.trim(), password: $('#lp').value }) });
      const d = await r.json(); if (!r.ok) throw new Error(d.error_description || d.msg || 'Неверный email или пароль'); saveTokens(d); start(); }
    catch (err) { $('#lerr').textContent = err.message; } finally { $('#lb').disabled = false; } });
  $('#lg').addEventListener('click', () => { location.href = `${SB}/auth/v1/authorize?provider=google&redirect_to=${encodeURIComponent(location.origin + location.pathname)}`; });
  (DEMO || session) ? start() : logout();

  // ---------------------------------------------------------------- demo data (?demo=1): lets the page be previewed without the backend
