<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Страница не найдена — ONEFLOW</title>
    <meta name="description" content="Такой страницы в ONEFLOW нет. Вернитесь на главную и продолжите работу." />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0E0E11" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <!--
      Deliberately standalone: no bundle, no fonts, no JS. A 404 is served exactly when
      something is already wrong with the path, so it must not depend on anything else
      resolving. On a host with the SPA rewrite in _redirects this is never reached; it's the
      fallback for hosts that serve 404.html instead (GitHub Pages, plain static buckets).
    -->
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #0e0e11;
        color: #f2f2f4;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        text-align: center;
      }
      .wrap { max-width: 420px; }
      .mark { width: 56px; height: 56px; margin: 0 auto 28px; display: block; }
      .code { font-size: 13px; letter-spacing: 0.14em; color: #8a8a94; text-transform: uppercase; }
      h1 { margin-top: 14px; font-size: 26px; font-weight: 600; letter-spacing: -0.02em; }
      p { margin-top: 12px; font-size: 14.5px; line-height: 1.5; color: #a0a0a8; }
      a {
        display: inline-block;
        margin-top: 26px;
        padding: 11px 22px;
        border-radius: 999px;
        background: #e4e4e7;
        color: #0a0a0c;
        font-size: 13.5px;
        font-weight: 600;
        text-decoration: none;
      }
      a:hover { background: #f4f4f5; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <img class="mark" src="/favicon.svg" alt="ONEFLOW" />
      <div class="code">Ошибка 404</div>
      <h1>Страница не найдена</h1>
      <p>Возможно, ссылка устарела или в адресе опечатка. Ваши проекты на месте — откройте главную.</p>
      <a href="/">На главную</a>
    </div>
  </body>
</html>
