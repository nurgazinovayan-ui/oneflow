<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ONEFLOW</title>
    <!--
      This site no longer hosts a checkout page. Paddle's "Hosted Checkout" required manual
      approval for desktop-app use cases and repeatedly rejected this app in review (common
      for AI image/video generation tools, flagged as higher-risk); the project switched to
      LemonSqueezy, which hosts its own checkout page directly — the app opens
      https://YOUR-STORE.lemonsqueezy.com/buy/... (see electron/paymentConfig.ts) instead of
      anything on this domain.

      This static site still exists because LemonSqueezy's own store setup/review wants a
      public site with company info and links to Terms/Privacy/Refund policy — that's what
      this page and terms.html/privacy.html/refunds.html are for. Keep it deployed at the
      same Netlify URL you already have on file with LemonSqueezy.
    -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        background: #050506;
        color: #f2f2f4;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card {
        text-align: center;
        max-width: 360px;
        padding: 32px;
      }
      .brand {
        font-family: 'Arial Black', Arial, sans-serif;
        font-weight: 900;
        font-size: 32px;
        letter-spacing: -1px;
        color: #e5157e;
        margin-bottom: 8px;
      }
      p {
        color: #8f8f97;
        font-size: 13px;
        line-height: 1.5;
        margin-bottom: 20px;
      }
      .legal-links {
        margin-top: 8px;
        font-size: 12px;
        color: #5c5c63;
      }
      .legal-links a {
        color: #8f8f97;
        text-decoration: underline;
        margin: 0 4px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="brand">ONEFLOW</div>
      <p>
        Нод-редактор для генерации фото и видео через нейросети. Оформление подписки
        происходит на странице оплаты LemonSqueezy — сайт открывается автоматически из
        приложения после входа в аккаунт.
      </p>
      <div class="legal-links">
        <a href="terms.html">Условия использования</a>·
        <a href="privacy.html">Конфиденциальность</a>·
        <a href="refunds.html">Возвраты</a>
      </div>
    </div>
  </body>
</html>
