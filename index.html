<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ONEFLOW — фото, видео и тексты для рекламы</title>
    <meta
      name="description"
      content="ONEFLOW — рабочее место для рекламного контента: генерация фото и видео нейросетями, адаптация под форматы площадок, тексты и готовые документы."
    />
    <meta name="theme-color" content="#0E0E11" />

    <!-- SVG first for browsers that take it (crisp at any size), .ico as the fallback. -->
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

    <!-- Link previews. The relative image is rewritten to an absolute URL at build time when
         VITE_SITE_URL is set (see the seo plugin in vite.config.ts) — some scrapers refuse to
         resolve a relative og:image. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ONEFLOW" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:title" content="ONEFLOW — фото, видео и тексты для рекламы" />
    <meta
      property="og:description"
      content="Генерация фото и видео нейросетями, адаптация под форматы площадок, тексты и готовые документы — в одном окне."
    />
    <meta property="og:image" content="./og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ONEFLOW — фото, видео и тексты для рекламы" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ONEFLOW — фото, видео и тексты для рекламы" />
    <meta
      name="twitter:description"
      content="Генерация фото и видео нейросетями, адаптация под форматы площадок, тексты и готовые документы — в одном окне."
    />
    <meta name="twitter:image" content="./og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
