<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ONEFLOW — photos, videos and copy for ads</title>
    <meta
      name="description"
      content="ONEFLOW — a workspace for ad content: AI photos and videos, adaptation to every platform format, copy and ready documents."
    />
    <meta name="theme-color" content="#E5E5E5" />

    <!-- SVG first for browsers that take it (crisp at any size), .ico as the fallback. -->
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

    <!-- Link previews. The relative image is rewritten to an absolute URL at build time when
         VITE_SITE_URL is set (see the seo plugin in vite.config.ts) — some scrapers refuse to
         resolve a relative og:image. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ONEFLOW" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="ONEFLOW — photos, videos and copy for ads" />
    <meta
      property="og:description"
      content="AI photos and videos, adaptation to every platform format, copy and ready documents — in one window."
    />
    <meta property="og:image" content="./og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ONEFLOW — photos, videos and copy for ads" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ONEFLOW — photos, videos and copy for ads" />
    <meta
      name="twitter:description"
      content="AI photos and videos, adaptation to every platform format, copy and ready documents — in one window."
    />
    <meta name="twitter:image" content="./og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
